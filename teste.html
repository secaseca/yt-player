<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- FIX 1: Force a referrer policy for the whole page -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YT Debug (HTTPS)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#ddd;font:13px/1.4 system-ui,sans-serif;padding:12px}
h1{font-size:14px;margin:0 0 10px;color:#fff}
.row{display:flex;gap:6px;margin-bottom:10px}
input{flex:1;min-width:0;padding:10px;border:1px solid #333;border-radius:6px;background:#1a1a1a;color:#fff;font-size:14px}
button{padding:10px 14px;border:1px solid #555;border-radius:6px;background:#222;color:#fff;font-size:13px}
button:active{background:#333}
#player{width:100%;aspect-ratio:16/9;background:#000;border:1px solid #333;border-radius:6px;margin-bottom:10px;overflow:hidden}
#player iframe{width:100%;height:100%;border:0;display:block}
#log{background:#000;border:1px solid #333;border-radius:6px;padding:8px;height:45vh;overflow:auto;font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
.ok{color:#6f6}
.err{color:#f66}
.warn{color:#fc6}
.dim{color:#888}
</style>
</head>
<body>

<h1>YT Player — Debug (HTTPS)</h1>

<div class="row">
  <input id="url" type="text" placeholder="YouTube link or ID" autocomplete="off" spellcheck="false">
  <button id="go">LOAD</button>
</div>

<div id="player"></div>
<div id="log"></div>

<script>
const logEl = document.getElementById('log');
const urlEl = document.getElementById('url');

function log(msg, cls){
  const t = new Date().toISOString().slice(11,23);
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = '[' + t + '] ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log('[YTD]', msg);
}

function extractId(text){
  text = String(text||'').trim();
  return text.match(/[?&]v=([\w-]{11})/)?.[1] ||
         text.match(/youtu\.be\/([\w-]{11})/)?.[1] ||
         text.match(/youtube\.com\/(?:embed|shorts|live)\/([\w-]{11})/)?.[1] ||
         (/^[\w-]{11}$/.test(text) ? text : null);
}

// ---- environment dump ----
log('UA: ' + navigator.userAgent, 'dim');
log('protocol: ' + location.protocol + '  origin: ' + location.origin, 'dim');
log('isSecureContext: ' + window.isSecureContext, 'dim');
log('online: ' + navigator.onLine, 'dim');
if (!window.isSecureContext) {
  log('!! Not a secure context — YouTube API may refuse to load even on HTTPS', 'err');
}

// ---- API loader with polling watchdog ----
let apiReady = false;
let pendingId = null;

log('creating <script src=iframe_api>…');
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
tag.onerror = () => log('!! script onerror fired — iframe_api blocked/failed', 'err');
tag.onload  = () => log('script onload fired (API may still be initializing)', 'dim');
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  apiReady = true;
  log('onYouTubeIframeAPIReady fired — YT=' + typeof window.YT + ' YT.Player=' + (window.YT && typeof window.YT.Player), 'ok');
  if (pendingId) {
    const id = pendingId;
    pendingId = null;
    makePlayer(id);
  }
};

// watchdog: warn if API not ready after 8s
setTimeout(() => {
  if (!apiReady) {
    log('!! after 8s still no onYouTubeIframeAPIReady — API is not loading', 'err');
    log('   YT=' + typeof window.YT + '  head scripts=' + document.scripts.length, 'dim');
  }
}, 8000);

// ---- player ----
let yt = null;

function makePlayer(id){
  log('makePlayer(' + id + ')');
  const box = document.getElementById('player');
  box.innerHTML = '<div id="frame"></div>';

  try {
    yt = new YT.Player('frame', {
      width: '100%',
      height: '100%',
      videoId: id,
      playerVars: {
        autoplay: 1,
        mute: 1,
        playsinline: 1,
        controls: 1,
        origin: location.origin,
        enablejsapi: 1
      },
      events: {
        onReady: e => {
          log('onReady', 'ok');
          log('  duration=' + e.target.getDuration() + ' state=' + e.target.getPlayerState());
          e.target.mute();
          e.target.playVideo();
          log('  called mute()+playVideo()');
        },
        onStateChange: e => {
          const names = {[-1]:'UNSTARTED',0:'ENDED',1:'PLAYING',2:'PAUSED',3:'BUFFERING',5:'CUED'};
          log('onStateChange: ' + e.data + ' (' + (names[e.data]||'?') + ')');
        },
        onError: e => {
          const codes = {2:'invalid param',5:'HTML5 player error',100:'video not found / private',101:'embed not allowed',150:'embed not allowed',153:'referrer/origin check failed'};
          log('!! onError code=' + e.data + ' (' + (codes[e.data]||'?') + ')', 'err');
        }
      }
    });
    log('YT.Player constructed');
  } catch (err) {
    log('!! YT.Player threw: ' + err.message, 'err');
  }
}

// ---- load button ----
document.getElementById('go').onclick = () => {
  const id = extractId(urlEl.value);
  if (!id) { log('!! invalid link', 'err'); return; }
  log('--- load request: ' + id);

  if (yt && yt.destroy) { yt.destroy(); yt = null; log('old player destroyed'); }

  if (!apiReady) {
    pendingId = id;
    log('API not ready yet — queued', 'warn');
    return;
  }
  makePlayer(id);
};

urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });

// ---- extra signals ----
window.addEventListener('error', e => {
  if (e.message && /YT|youtube|iframe/i.test(e.message)) log('window.onerror: ' + e.message, 'err');
});
window.addEventListener('unhandledrejection', e => {
  log('unhandledrejection: ' + (e.reason && e.reason.message || e.reason), 'err');
});

log('debug page ready — serve over HTTPS, paste a link, press LOAD');
</script>

</body>
</html>
