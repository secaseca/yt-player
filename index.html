
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YT Player</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: system-ui, sans-serif;
}

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
}

#home {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 24px;
  text-align: center;
}

.logo {
  font-size: 13px;
  letter-spacing: 4px;
  color: #777;
  font-weight: 600;
}

#paste {
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px 38px;
  background: #171717;
  color: white;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}

#paste:hover {
  background: #252525;
  border-color: #666;
}

#paste:active {
  transform: scale(.98);
}

#status {
  font-size: 12px;
  color: #666;
}

#player {
  position: fixed;
  inset: 0;
  display: none;
  background: #000;
}

#player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

#again {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 2;
  padding: 10px 15px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #151515;
  color: #aaa;
  font-size: 12px;
  opacity: .25;
  cursor: pointer;
}

#again:hover {
  opacity: 1;
}
</style>
</head>

<body>

<main id="home">
  <div class="logo">YT PLAYER</div>
  <button id="paste">PASTE VIDEO LINK</button>
  <div id="status">Copy a YouTube link to get started</div>
</main>

<div id="player">
  <button id="again">NEW VIDEO</button>
</div>

<script>
const home = document.getElementById("home");
const player = document.getElementById("player");

function extractId(text) {
  return (
    text.match(/[?&]v=([\w-]{11})/)?.[1] ||
    text.match(/youtu\.be\/([\w-]{11})/)?.[1] ||
    text.match(/youtube\.com\/(?:embed|shorts)\/([\w-]{11})/)?.[1] ||
    (/^[\w-]{11}$/.test(text.trim()) ? text.trim() : null)
  );
}

function loadVideo(id) {
  home.style.display = "none";
  player.style.display = "block";

  player.innerHTML = `
    <button id="again">NEW VIDEO</button>
    <iframe
      src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  `;

  document.getElementById("again").onclick = reset;
}

function reset() {
  player.innerHTML = "";
  player.style.display = "none";
  home.style.display = "flex";
}

document.getElementById("paste").onclick = async () => {
  try {
    const text = await navigator.clipboard.readText();
    const id = extractId(text);

    if (!id) {
      document.getElementById("status").textContent =
        "No valid YouTube link found in clipboard";
      return;
    }

    loadVideo(id);
  } catch (e) {
    document.getElementById("status").textContent =
      "Clipboard unavailable. Check browser permissions.";
  }
};

// Optional: support direct links like ?yt=VIDEO_ID
const params = new URLSearchParams(location.search);
const directId = params.get("yt");

if (directId && /^[\w-]{11}$/.test(directId)) {
  loadVideo(directId);
}
</script>

</body>
</html>
